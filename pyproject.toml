[project]
name = "trip"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mayyzze", email = "achille.depoix@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mistralai>=3.8.0",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "ruff>=0.17.6",
]

[project.scripts]
trip = "trip.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-socket>=0.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--allow-hosts=127.0.0.1,::1 --ignore=mocks"
